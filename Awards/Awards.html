<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clutch Competitor Series - Award Show</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
        }

        #presentation-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
            pointer-events: none;
            text-align: center;
        }

        .slide.active {
            opacity: 1;
            pointer-events: all;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
        }
        
        h2 {
            font-size: 3rem;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .league-logo-large {
            margin-bottom: 20px;
        }

        .league-logo-large img {
            max-height: 180px; 
            width: auto;
            filter: drop-shadow(0px 10px 10px rgba(0,0,0,0.5));
        }

        .slide-league-logo {
            max-height: 70px;
            width: auto;
            margin-right: 20px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        /* Inline Award Image Styling */
        .inline-award-logo {
            max-height: 75px;
            width: auto;
            margin-left: 20px;
            filter: drop-shadow(0px 5px 8px rgba(0,0,0,0.6));
        }

        .finalists-grid {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: stretch;
            width: 80%;
            max-width: 1200px;
        }

        .finalist-card {
            flex: 1;
            border-radius: 15px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease;
        }

        .team-logo {
            margin-bottom: 20px;
            width: 140px;
            height: 140px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.5));
        }

        .player-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Title Screen Logos Container */
        .title-logos-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        .title-logos-container img {
            max-height: 120px;
            width: auto;
            filter: drop-shadow(0px 5px 15px rgba(255, 255, 255, 0.1));
        }

        #counter {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 1rem;
            color: #666;
        }

        /* --- Winner Card Styling --- */
        .winner-card-large {
            border-radius: 25px;
            padding: 40px 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.15);
            border: 4px solid rgba(255, 255, 255, 0.3);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 80%;
            max-width: 1000px;
        }

        .slide.active .winner-card-large {
            transform: scale(1);
            opacity: 1;
        }

        .winner-subtitle {
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
        }

        .winner-main-info {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 30px;
        }

        .winner-team-logo {
            width: 180px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .winner-team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.8));
        }

        .winner-player-name {
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 3px 5px 15px rgba(0,0,0,0.9);
            color: white;
            text-transform: uppercase;
        }

        /* --- Stat Boxes --- */
        .winner-stats-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 10px;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 15px 20px;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #cccccc;
            text-align: center;
        }

        /* First/Second Team Winner Cards */
        .team-winners-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            width: 90%;
            max-width: 1400px;
        }
        
        .team-winner-card {
            flex: 1;
            border-radius: 20px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transform: translateY(50px);
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .slide.active .team-winner-card {
            transform: translateY(0);
            opacity: 1;
        }

        .slide.active .team-winner-card:nth-child(2) { transition-delay: 0.1s; }
        .slide.active .team-winner-card:nth-child(3) { transition-delay: 0.2s; }
    </style>
</head>

        // CNL Tier
        const cnlFinalists = {

            ],
            "4th Man of the Year": [
                { player: "Spiral", teamColor: "#CC0000", teamLogo: "CNLLogos/bushido.png" },

                { player: "Hamm", teamColor: "#1a1a1a", teamLogo: "CNLLogos/thieves.png" }
            ],
            "Rookie of the Year": [

                { player: "Botco", teamColor: "#FF69B4", teamLogo: "CNLLogos/timberwolves.png", isWinner: true, stats: [{label: "MVPR", value: "4.7"}, {label: "Avg Score", value: "466"}, {label: "GPG", value: "1.4"}, {label: "APG", value: "0.7"}, {label: "SPG", value: "1.3"}] },
                { player: "Nirosat", teamColor: "#008080", teamLogo: "CNLLogos/leviathans.png" }
            ],
            "Golden Clam": [

                { player: "Deplooped", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png", isWinner: true, stats: [{label: "Saves", value: "77"}, {label: "Saves/Game", value: "1.9"}, {label: "Series High", value: "13"}] },
                { player: "Nirosat", teamColor: "#008080", teamLogo: "CNLLogos/leviathans.png" }
            ],
            "Best Playmaker": [
                { player: "Fast Layne", teamColor: "#DAA520", teamLogo: "CNLLogos/anacondas.png" },
                { player: "Deplooped", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png", isWinner: true, stats: [{label: "Assists", value: "33"}, {label: "Assists/Game", value: "0.8"}, {label: "Series High", value: "7"}] },
                { player: "Eyes", teamColor: "#0055A4", teamLogo: "CNLLogos/sound.png" }
            ],
            "Best Scorer": [
                { player: "Deplooped", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png" },
                { player: "Botco", teamColor: "#FF69B4", teamLogo: "CNLLogos/timberwolves.png", isWinner: true, stats: [{label: "Goals", value: "57"}, {label: "Goals/Game", value: "1.4"}, {label: "Series High", value: "8"}] },
                { player: "Haakonn", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png" }
            ],
            "Second Team": [
                { player: "Haakonn", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png", isWinner: true },
                { player: "Terbiee", teamColor: "#228B22", teamLogo: "CNLLogos/redwings.png", isWinner: true },
                { player: "Chrome", teamColor: "#E0E0E0", teamLogo: "CNLLogos/moisty rhinos.png", isWinner: true }
            ],
            "First Team": [
                { player: "Deplooped", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png", isWinner: true },
                { player: "Botco", teamColor: "#FF69B4", teamLogo: "CNLLogos/timberwolves.png", isWinner: true },
                { player: "Eyes", teamColor: "#0055A4", teamLogo: "CNLLogos/sound.png", isWinner: true }
            ],
            "MVP": [
                { player: "Botco", teamColor: "#FF69B4", teamLogo: "CNLLogos/timberwolves.png" },
                { player: "Deplooped", teamColor: "#FF8C00", teamLogo: "CNLLogos/ballistics.png", isWinner: true, stats: [{label: "MVPR", value: "5.3"}, {label: "Avg Score", value: "503"}, {label: "GPG", value: "1.3"}, {label: "APG", value: "0.8"}, {label: "SPG", value: "1.9"}] },
                { player: "Eyes", teamColor: "#0055A4", teamLogo: "CNLLogos/sound.png" }
            ]
        };

        const leagueDataMap = {
            "CCS": ccsFinalists,
            "CPL": cplFinalists,
            "CAS": casFinalists,
            "CNL": cnlFinalists
        };


        // --- 3. HELPER FUNCTION FOR IMAGE NAMES ---
        function getAwardFileName(awardName) {
            return awardName.toLowerCase().replace(/\s/g, '');
        }


        // --- 4. GENERATE THE DATA STRUCTURE ---
        const presentationData = [];

        leaguesInfo.forEach(league => {
            let leagueAwards = [...standardAwards];
            
            if (league.id === "CCS") {
                leagueAwards.unshift("Manager of the Year");
            }

            const awardsData = leagueAwards.map(awardName => {
                return {
                    name: awardName,
                    finalists: leagueDataMap[league.id][awardName] || []
                };
            });

            presentationData.push({
                ...league,
                awards: awardsData
            });
        });

        // --- 5. BUILD THE HTML SLIDES ---
        const container = document.getElementById('presentation-container');
        let slidesHTML = '';

        slidesHTML += `
            <div class="slide active">
                <h1>Clutch Competitor Series</h1>
                <h2>Award Show</h2>
                
                <div class="title-logos-container">
                    <img src="CCSLogos/CCS.png" alt="CCS Logo" onerror="this.style.display='none';">
                    <img src="CPLLogos/CPL.png" alt="CPL Logo" onerror="this.style.display='none';">
                    <img src="CASLogos/CAS.png" alt="CAS Logo" onerror="this.style.display='none';">
                    <img src="CNLLogos/CNL.png" alt="CNL Logo" onerror="this.style.display='none';">
                </div>
            </div>
        `;

        presentationData.forEach(league => {
            // League Title Slide
            slidesHTML += `
                <div class="slide" style="background: radial-gradient(circle, ${league.color} 0%, var(--bg-color) 70%);">
                    <div class="league-logo-large">
                        <img src="${league.logoFolder}/${league.logoFile}" alt="${league.name} Logo" onerror="this.style.display='none';">
                    </div>
                    <h1 style="color: ${league.color}; text-shadow: 2px 2px 10px rgba(0,0,0,0.8);">${league.name}</h1>
                    <h2>Awards Show</h2>
                </div>
            `;

            // --- CHAMPIONSHIP SLIDE ---
            // MOVED UP to appear immediately after the League Title Screen
            if (league.champions) {
                const champs = league.champions;
                const trophyName = `${league.id.toLowerCase()}trophy.png`;

                slidesHTML += `
                    <div class="slide">
                        <h2 style="color: ${league.color};">
                            <img src="${league.logoFolder}/${league.logoFile}" class="slide-league-logo" alt="${league.name} Logo" onerror="this.style.display='none';">
                            <span style="color:white; margin-right: 15px;">${league.name}</span> Clutch Series Winners
                            <img src="awardimages/${trophyName}" class="inline-award-logo" alt="Trophy" onerror="this.style.display='none';">
                        </h2>
                        
                        <div class="winner-card-large" style="background-color: ${champs.teamColor}; border-color: ${league.color}; box-shadow: 0 0 60px ${league.color}40; max-width: 1200px;">
                            <div class="winner-main-info" style="margin-bottom: 15px;">
                                <div class="winner-team-logo" style="width: 200px; height: 200px;">
                                    <img src="${champs.teamLogo}" alt="Team Logo" onerror="this.style.display='none';">
                                </div>
                            </div>
                            
                            <div class="winner-player-name" style="font-size: 3.5rem; text-align: center; margin-bottom: 10px;">${champs.teamName}</div>
                            <div style="font-size: 1.4rem; color: #ddd; margin-bottom: 30px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase;">
                                Roster: ${champs.roster}
                            </div>
                            
                            <div style="width: 100%; border-top: 2px solid rgba(255,255,255,0.2); padding-top: 25px; display: flex; flex-direction: column; align-items: center;">
                                <div style="font-size: 1.8rem; text-transform: uppercase; letter-spacing: 4px; color: ${league.color}; margin-bottom: 15px; font-weight: bold; text-shadow: 1px 1px 5px rgba(0,0,0,0.8);">
                                    Clutch Series MVP: <span style="color: white;">${champs.mvpName}</span>
                                </div>
                                <div class="winner-stats-container">
                                    ${champs.mvpStats.map(s => `
                                        <div class="stat-box">
                                            <div class="stat-value" style="color: ${league.color};">${s.value}</div>
                                            <div class="stat-label">${s.label}</div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }

            // Loop Over Standard Awards
            league.awards.forEach(award => {
                if (award.finalists.length === 0) return; 

                const isTeamAward = award.name.includes("Team");
                const pngFileName = getAwardFileName(award.name);

                // FINALIST SLIDE (Skip for First/Second Team)
                if (!isTeamAward) {
                    let finalistsHTML = award.finalists.map(f => `
                        <div class="finalist-card" style="background-color: ${f.teamColor};">
                            <div class="team-logo">
                                <img src="${f.teamLogo}" alt="Team Logo" onerror="this.style.display='none';">
                            </div>
                            <div class="player-name">${f.player}</div>
                        </div>
                    `).join('');

                    slidesHTML += `
                        <div class="slide">
                            <h2 style="color: ${league.color};">
                                <img src="${league.logoFolder}/${league.logoFile}" class="slide-league-logo" alt="${league.name} Logo" onerror="this.style.display='none';">
                                <span style="color:white; margin-right: 15px;">${league.name}</span> ${award.name} Finalists
                                <img src="awardimages/${pngFileName}.png" class="inline-award-logo" alt="${award.name}" onerror="this.style.display='none';">
                            </h2>
                            <div class="finalists-grid">
                                ${finalistsHTML}
                            </div>
                        </div>
                    `;
                }

                // WINNER SLIDE
                if (isTeamAward) {
                    let teamWinnersHTML = award.finalists.map(w => `
                        <div class="team-winner-card" style="background-color: ${w.teamColor};">
                            <div class="team-logo" style="width: 120px; height: 120px;">
                                <img src="${w.teamLogo}" alt="Team Logo" onerror="this.style.display='none';">
                            </div>
                            <div class="player-name" style="font-size: 2.2rem; margin-top: 10px;">${w.player}</div>
                        </div>
                    `).join('');

                    slidesHTML += `
                        <div class="slide">
                            <h2 style="color: ${league.color};">
                                <img src="${league.logoFolder}/${league.logoFile}" class="slide-league-logo" alt="${league.name} Logo" onerror="this.style.display='none';">
                                <span style="color:white; margin-right: 15px;">${league.name}</span> ${award.name}
                                <img src="awardimages/${pngFileName}.png" class="inline-award-logo" alt="${award.name}" onerror="this.style.display='none';">
                            </h2>
                            <div class="team-winners-grid">
                                ${teamWinnersHTML}
                            </div>
                        </div>
                    `;

                } else {
                    const winner = award.finalists.find(f => f.isWinner);
                    if (winner) {
                        let statsHTML = '';
                        if (winner.stats) {
                            statsHTML = `<div class="winner-stats-container">`;
                            winner.stats.forEach(s => {
                                statsHTML += `
                                    <div class="stat-box">
                                        <div class="stat-value" style="color: ${league.color};">${s.value}</div>
                                        <div class="stat-label">${s.label}</div>
                                    </div>
                                `;
                            });
                            statsHTML += `</div>`;
                        }

                        slidesHTML += `
                            <div class="slide">
                                <h2 style="color: ${league.color};">
                                    <img src="${league.logoFolder}/${league.logoFile}" class="slide-league-logo" alt="${league.name} Logo" onerror="this.style.display='none';">
                                    <span style="color:white; margin-right: 15px;">${league.name}</span> ${award.name} Winner
                                    <img src="awardimages/${pngFileName}.png" class="inline-award-logo" alt="${award.name}" onerror="this.style.display='none';">
                                </h2>
                                <div class="winner-card-large" style="background-color: ${winner.teamColor}; border-color: ${league.color}; box-shadow: 0 0 60px ${league.color}40;">
                                    <div class="winner-subtitle" style="color: ${league.color};">Congratulations</div>
                                    <div class="winner-main-info">
                                        <div class="winner-team-logo">
                                            <img src="${winner.teamLogo}" alt="Team Logo" onerror="this.style.display='none';">
                                        </div>
                                        <div class="winner-player-name">${winner.player}</div>
                                    </div>
                                    ${statsHTML}
                                </div>
                            </div>
                        `;
                    }
                }
            });
        });

        container.innerHTML = slidesHTML;

        // --- 6. NAVIGATION LOGIC ---
        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('.slide');
        const counter = document.getElementById('counter');

        function updateSlide(newIndex) {
            slides[currentSlideIndex].classList.remove('active');
            
            if (newIndex >= slides.length) currentSlideIndex = 0;
            else if (newIndex < 0) currentSlideIndex = slides.length - 1;
            else currentSlideIndex = newIndex;

            slides[currentSlideIndex].classList.add('active');
            counter.innerText = `${currentSlideIndex + 1} / ${slides.length}`;
        }

        counter.innerText = `1 / ${slides.length}`;

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                updateSlide(currentSlideIndex + 1);
            } else if (e.key === 'ArrowLeft') {
                updateSlide(currentSlideIndex - 1);
            }
        });
    </script>
</body>
