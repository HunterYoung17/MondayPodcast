<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Camera Overlay - Sports (Centered)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;700&display=swap');

        :root {
            --gold-light: #FFD700;
            --gold-dark: #B8860B;
            --text-color: #ffffff;
            --grey-dark: #2C2C2C;
        }

        body {
            margin: 0;
            padding: 0;
            width: 1920px;
            height: 1080px;
            background-color: transparent;
            font-family: 'Roboto', sans-serif;
            overflow: hidden;
            /* Flexbox to center everything perfectly in the 1920x1080 canvas */
            display: flex;
            justify-content: center; 
            align-items: center;     
        }

        .cam-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 1200px; /* Large size for a solo camera view */
        }

        .cam-frame {
            width: 100%;
            aspect-ratio: 16/9;
            border: 3px solid var(--gold-dark);
            background: rgba(44, 44, 44, 0.5);
            box-shadow: 0 0 30px rgba(184, 134, 11, 0.3);
            position: relative;
            border-radius: 4px;
        }

        .cam-frame::after {
            content: '';
            position: absolute;
            top: -5px; right: -5px;
            width: 40px; height: 40px;
            border-top: 5px solid var(--gold-light);
            border-right: 5px solid var(--gold-light);
        }
        
        .cam-frame::before {
            content: '';
            position: absolute;
            bottom: -5px; left: -5px;
            width: 40px; height: 40px;
            border-bottom: 5px solid var(--gold-light);
            border-left: 5px solid var(--gold-light);
        }

        .cam-label {
            margin-top: 25px;
            font-size: 2rem; 
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.8), transparent);
            padding: 10px 60px;
            border-bottom: 2px solid var(--gold-dark);
            font-family: 'Cinzel', serif;
            text-shadow: 2px 2px 5px black;
        }
    </style>
</head>
<body>

    <div class="cam-box">
        <div class="cam-frame"></div>
        <div class="cam-label">Sports</div>
    </div>

    <script>
        // Wireless Transmitter
        const channel = new BroadcastChannel('stream-control');

        // Keyboard controls
        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space' || event.code === 'Enter' || event.code === 'ArrowDown') {
                event.preventDefault(); 
                channel.postMessage('next');
            }
            if (event.code === 'ArrowUp') {
                event.preventDefault();
                channel.postMessage('prev');
            }
        });
    </script>
</body>
</html>
