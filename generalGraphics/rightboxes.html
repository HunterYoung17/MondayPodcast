<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Cams Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }

        .layout-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .column {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .column.right {
            right: 40px;
        }

        .cam-frame {
            width: 320px;
            height: 180px;
            border: 4px solid #ffffff;
            border-radius: 12px;
            box-shadow: 0 15px 25px rgba(0,0,0,0.4);
            background-color: #1a1a1a; 
            background-size: contain; 
            background-repeat: no-repeat;
            background-position: center;
            position: relative; 
            overflow: hidden; 
        }

        .cam-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 1;
        }

        .nameplate {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 6px 0;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-top: 2px solid rgba(255, 255, 255, 0.2); 
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="layout-container">
        <div class="column right" id="cam-container"></div>
    </div>

    <script>
        const sheetId = '1jO-rzUmCeklTLTV9w_uHkZH0C5oxV9Hc-7jtNFWj2Eo'; 
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=1501803735`;

        async function loadCams() {
            try {
                const response = await fetch(url);
                const data = await response.text();
                const jsonText = data.substring(47).slice(0, -2);
                const json = JSON.parse(jsonText);
                const container = document.getElementById('cam-container');
                container.innerHTML = ''; 

                // slice(1, 4) grabs exactly rows 2, 3, and 4 from the sheet
                json.table.rows.slice(1, 4).forEach(row => {
                    const name = row.c[0] ? row.c[0].v : '';
                    if (!name) return;

                    const bgColor = row.c[1] ? row.c[1].v : 'rgba(244, 30, 27, 0.85)'; 
                    const sourceUrl = row.c[2] ? row.c[2].v : '';
                    const imageUrl = row.c[3] ? row.c[3].v : '';
                    const textColor = row.c[4] ? row.c[4].v : '#ffffff'; 

                    const frame = document.createElement('div');
                    frame.className = 'cam-frame';

                    if (imageUrl) {
                        frame.style.backgroundImage = `url('${imageUrl}')`;
                    }

                    let innerHTML = '';
                    if (sourceUrl) {
                        innerHTML += `<iframe class="cam-iframe" src="${sourceUrl}" allow="autoplay; camera; microphone"></iframe>`;
                    }
                    
                    innerHTML += `<div class="nameplate" style="background-color: ${bgColor}; color: ${textColor};">${name}</div>`;
                    
                    frame.innerHTML = innerHTML;
                    container.appendChild(frame);
                });
            } catch (error) {
                console.error('Error fetching sheet data:', error);
            }
        }

        loadCams();
    </script>
</body>
</html>
